<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة الإدارة</title><link rel="stylesheet" href="/styles.css"></head><body><main class="wrap adminWrap"><div id="login" class="panel" style="max-width:480px;margin:70px auto"><h1>دخول الإدارة</h1><form id="loginForm" class="form"><input id="email" type="email" placeholder="البريد الإلكتروني" required><input id="password" type="password" placeholder="كلمة المرور" required><button class="btn">دخول</button></form><p id="loginErr" class="muted"></p></div><div id="dash" style="display:none"><div class="adminNav"><div><span class="eyebrow">ADMIN</span><h1>لوحة التحكم</h1></div><div class="actions"><button class="btn" onclick="showProductForm()">+ منتج جديد</button><button class="btn" onclick="logout()">خروج</button></div></div><div class="adminGrid"><section class="panel"><h2>الطلبات</h2><div id="orders"></div></section><section class="panel"><h2>المنتجات</h2><div id="products"></div></section></div></div></main><div id="modal" class="modal hidden"><div class="modalBox"><button class="close" onclick="closeModal()">×</button><div id="modalContent"></div></div></div><script>
let products=[],orders=[];const $=s=>document.querySelector(s);async function api(url,opt){const r=await fetch(url,opt);const d=await r.json();if(r.status===401){showLogin();throw 0}if(!r.ok)throw new Error(d.error||"خطأ");return d}
async function boot(){try{await api("/api/admin/me");showDash();await refresh()}catch(e){showLogin()}}function showLogin(){$("#login").style.display="block";$("#dash").style.display="none"}function showDash(){$("#login").style.display="none";$("#dash").style.display="block"}
loginForm.onsubmit=async e=>{e.preventDefault();try{await api("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:email.value,password:password.value})});showDash();refresh()}catch(e){loginErr.textContent=e.message}}
async function refresh(){orders=await api("/api/admin/orders");products=await api("/api/admin/products");renderOrders();renderProducts()}
function renderOrders(){ordersDiv=orders.map(o=>`<div class="panel" style="margin:10px 0"><b>${o.order_number}</b><p>${o.customer_name} · ${o.phone} · ${o.city}</p><p><b>${Number(o.total).toFixed(2)} MAD</b> · <span class="pill">${o.status}</span></p><p class="muted">${new Date(o.created_at).toLocaleString("ar-MA")}</p><select onchange="updateOrder(${o.id},this.value)">${["جديد","تم التأكيد","قيد التجهيز","تم الشحن","تم التسليم","ملغى"].map(s=>`<option ${s===o.status?"selected":""}>${s}</option>`).join("")}</select><textarea id="msg${o.id}" placeholder="رسالة للعميل">${o.admin_message||""}</textarea><div class="actions"><button class="btn" onclick="saveMessage(${o.id})">حفظ والرد</button><a class="btn" href="https://wa.me/${encodeURIComponent(o.phone.replace(/^0/,"212"))}?text=${encodeURIComponent("مرحباً، بخصوص طلبك "+o.order_number+" من المتجر.")}" target="_blank">واتساب</a></div></div>`).join("");$("#orders").innerHTML=ordersDiv||"<div class='empty'>لا توجد طلبات.</div>"}
function renderProducts(){$("#products").innerHTML=products.map(p=>`<div class="item"><img src="${esc(p.image_url)}"><div style="flex:1"><b>${esc(p.name)}</b><div>${Number(p.price).toFixed(2)} MAD · المخزون ${p.stock}</div><div class="actions"><button onclick="editProduct(${p.id})">تعديل</button><button class="danger" onclick="deleteProduct(${p.id})">حذف</button></div></div></div>`).join("")}
async function updateOrder(id,status){await api("/api/admin/orders/"+id,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({status,admin_message:document.querySelector("#msg"+id).value})});refresh()}
async function saveMessage(id){const o=orders.find(x=>x.id===id);await updateOrder(id,o.status)}
function showProductForm(p=null){$("#modal").classList.remove("hidden");$("#modalContent").innerHTML=`<h2>${p?"تعديل المنتج":"إضافة منتج"}</h2><form id="pf" class="form"><input name="name" value="${esc(p?.name||"")}" placeholder="اسم المنتج" required><textarea name="description" placeholder="الوصف">${esc(p?.description||"")}</textarea><div class="row"><input name="price" type="number" step="0.01" value="${p?.price||0}" placeholder="السعر"><input name="stock" type="number" value="${p?.stock||0}" placeholder="المخزون"></div><input name="image_url" value="${esc(p?.image_url||"")}" placeholder="رابط صورة المنتج"><input name="category" value="${esc(p?.category||"ملابس")}" placeholder="الفئة"><input name="sizes" value="${esc((p?.sizes||[]).join(", "))}" placeholder="المقاسات: S, M, L"><input name="colors" value="${esc((p?.colors||[]).join(", "))}" placeholder="الألوان: أسود, أبيض"><button class="btn">${p?"حفظ التعديلات":"إضافة"}</button></form>`;pf.onsubmit=async e=>{e.preventDefault();const f=new FormData(pf),b=Object.fromEntries(f.entries());b.price=Number(b.price);b.stock=Number(b.stock);b.sizes=b.sizes.split(",").map(x=>x.trim()).filter(Boolean);b.colors=b.colors.split(",").map(x=>x.trim()).filter(Boolean);await api(p?"/api/admin/products/"+p.id:"/api/admin/products",{method:p?"PUT":"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});closeModal();refresh()}}
function editProduct(id){showProductForm(products.find(p=>p.id===id))}
async function deleteProduct(id){if(!confirm("حذف المنتج؟"))return;await api("/api/admin/products/"+id,{method:"DELETE"});refresh()}
async function logout(){await api("/api/admin/logout",{method:"POST"});showLogin()}
function closeModal(){$("#modal").classList.add("hidden")}function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}boot();
</script></body></html>

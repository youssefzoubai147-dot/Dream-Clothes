<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تتبع الطلب</title><link rel="stylesheet" href="/styles.css"></head><body><header class="top"><div class="wrap nav"><a class="brand" href="/">متجري</a><a class="btn" href="/">العودة للمتجر</a></div></header><main class="wrap adminWrap"><div class="panel"><h1>تتبع طلبك</h1><form id="form" class="form"><input id="order" placeholder="رقم الطلب ORD-..." required><input id="phone" placeholder="رقم الهاتف" required><button class="btn">بحث</button></form><div id="result" style="margin-top:20px"></div></div></main><script>
const q=new URLSearchParams(location.search);order.value=q.get("order")||"";phone.value=q.get("phone")||"";
form.onsubmit=async e=>{e.preventDefault();const r=await fetch(`/api/orders/track?order_number=${encodeURIComponent(order.value)}&phone=${encodeURIComponent(phone.value)}`),d=await r.json();result.innerHTML=!r.ok?`<div class="empty">${d.error}</div>`:`<div class="panel"><h2>الطلب ${d.order_number}</h2><p>الحالة: <span class="pill">${d.status}</span></p><p>المدينة: ${d.city}</p><p>المجموع: <b>${Number(d.total).toFixed(2)} MAD</b></p><p>رسالة المتجر: ${d.admin_message||"لا توجد رسالة بعد."}</p><h3>المنتجات</h3>${d.items.map(x=>`<div class="item"><div><b>${x.name}</b><div>${x.size} · ${x.color} · ${x.quantity}</div></div></div>`).join("")}</div>`}
</script></body></html>
